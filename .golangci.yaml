version: "2"

linters:
  default: standard
  exclusions:
    rules:
      - path: ^pkg/virefs/
        linters:
          - errcheck
      - path: ^pkg/log/tint/
        linters:
          - errcheck
          - staticcheck
      - path: ^internal/agent/provider_openai\.go$
        linters:
          - staticcheck
        text: SA1019.*MaxTokens

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - swaggo
