          items:
            $ref: "#/components/schemas/AskAnswer"
          minItems: 1
          type:
            - array
            - "null"
        ask_id:
          description: 要回答的提问轮次 ID，来自 SSE 的 ask 事件
          minLength: 1
          type: string
      type: object
    AskAnswer:
      additionalProperties: true
      properties:
        custom:
          type: string
        question_id:
          type: string
        selected:
          items:
