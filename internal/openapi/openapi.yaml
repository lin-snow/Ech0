          format: int64
          type: integer
        expiry:
          format: int64
          type:
            - integer
            - "null"
        id:
          type: string
        jti:
          type: string
        last_used_at:
          format: int64
          type: integer
        name:
          type: string
        scopes:
          type: string
        token:
          type: string
        token_type:
          type: string
        user_id:
          type: string
      type: object
    AccessTokenSettingDto:
      additionalProperties: true
      properties:
        audience:
          type: string
        expiry:
          type: string
        name:
          type: string
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    AddConnectDto:
      additionalProperties: true
      properties:
        connect_url:
          description: Peer instance root URL; the server calls <url>/api/connect
          type: string
      required:
        - connect_url
      type: object
    AgentSetting:
      additionalProperties: true
      properties:
        api_key:
          type: string
        base_url:
          type: string
        context_window:
          format: int64
          type: integer
        enable:
          type: boolean
        model:
          type: string
        multimodal:
          type: boolean
        prompt:
          type: string
        protocol:
          type: string
        temperature:
          format: double
          type: number
      type: object
    AgentSettingDto:
      additionalProperties: true
