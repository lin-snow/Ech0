      additionalProperties: true
      properties:
        created_at:
          format: int64
          type: integer
        echo_id:
          type: string
        id:
          type: string
        payload:
          additionalProperties: {}
          type: object
        type:
          type: string
        updated_at:
          format: int64
          type: integer
      type: object
    EchoExtensionDto:
      additionalProperties: true
      properties:
        payload:
          additionalProperties: {}
          description: Arbitrary fields the card needs to render
          type: object
        type:
          description: Card type, e.g. weather or music
          type: string
      type: object
    EchoFile:
      additionalProperties: true
      properties:
        file:
          $ref: "#/components/schemas/File"
        file_id:
          type: string
        sort_order:
          format: int64
          type: integer
      type: object
    EchoQueryDto:
      additionalProperties: true
      properties:
        cursor:
          description: Keyset pagination cursor; omit for page-based pagination, send an empty string for the first cursor page. Cursor mode ignores page and requires sortBy=created_at
          type: string
        dateFrom:
          description: Only Echoes created at or after this Unix time (seconds)
          format: int64
          type: integer
        dateTo:
          description: Only Echoes created at or before this Unix time (seconds)
          format: int64
          type: integer
        mine:
          description: Only Echoes authored by the authenticated caller; requires sign-in
          type: boolean
        page:
          description: Page number, 1-based (default 1); ignored when cursor is set
          format: int64
          type: integer
        pageSize:
          description: Items per page, 1-100 (default 10); also the cursor page size
          format: int64
          type: integer
        private:
          description: "Visibility filter: true for private only, false for public only; omit for both"
          type: boolean
        search:
          description: Substring match on Echo content
          type: string
        sortBy:
          description: Sort field (default created_at); cursor pagination requires created_at
          enum:
            - created_at
            - reactions
          type: string
        sortOrder:
          description: Sort direction (default desc)
          enum:
            - asc
            - desc
          type: string
        tagIds:
          description: Tag IDs to match; an Echo qualifies if it carries any listed tag
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    EchoUpsertDto:
      additionalProperties: true
      properties:
        content:
          description: Markdown body; supply at least one of content, files, or extension
          type: string
        created_at:
          description: Publish time in Unix seconds; defaults to now
          format: int64
          type: integer
        echo_files:
          description: Attachments as {file_id, sort_order}; upload files first to get file_id. Omit on update to keep existing attachments; send [] to clear
          items:
            $ref: "#/components/schemas/EchoFile"
          type: array
        extension:
          $ref: "#/components/schemas/EchoExtensionDto"
          description: "Card payload: {type, payload}"
        id:
          description: Echo ID to update; ignored on create
          type: string
        layout:
          description: "Layout: waterfall / grid / horizontal / carousel / stack / none"
          type: string
        private:
          description: Hidden from anonymous visitors; visible to all signed-in users
          type: boolean
        tags:
          description: Tags as {name}; an existing tag with the same name is reused
          items:
            $ref: "#/components/schemas/Tag"
          type:
            - array
            - "null"
      type: object
