info:
  title: Ech0 API 文档
  version: "1.0"
openapi: 3.1.0
paths:
  /access-tokens:
    get:
      operationId: access-token-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccessTokenSetting"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: 列出访问令牌
      tags:
        - Setting
    post:
      operationId: access-token-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenSettingDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: string
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: 创建访问令牌
      tags:
        - Setting
  /access-tokens/{id}:
    delete:
      operationId: access-token-delete
      parameters:
        - description: 资源 ID（UUID）
          in: path
          name: id
          required: true
          schema:
            description: 资源 ID（UUID）
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: 删除访问令牌
      tags:
        - Setting
  /agent/info:
    get:
      description: publishes the assistant identity and enabled capabilities
      operationId: agent-info
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSetting"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 获取 Agent 公开信息
      tags:
        - Setting
  /agent/recent:
    get:
      description: public digest of the author's recent posts
      operationId: copilot-recent
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 获取作者近况的 AI 总结
      tags:
        - Copilot
  /agent/settings:
    get:
      operationId: agent-settings-get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSetting"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth:
            - admin:agent
      summary: 获取 Agent 设置
      tags:
        - Setting
    put:
      operationId: agent-settings-update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSettingDto"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth:
            - admin:agent
      summary: 更新 Agent 设置
      tags:
        - Setting
  /agent/settings/test:
    post:
      operationId: agent-settings-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSettingDto"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth:
            - admin:agent
      summary: 测试 Copilot 连接
      tags:
        - Setting
  /chat/answer:
    post:
      operationId: copilot-chat-answer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerAskInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth:
            - admin:agent
      summary: 回答 Copilot 正在等待的提问/确认
      tags:
        - Copilot
  /chat/session:
    delete:
      operationId: copilot-session-clear
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth:
            - admin:agent
      summary: 清除持久化 Chat 会话
      tags:
        - Copilot
    get:
      operationId: copilot-session-get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ChatMessage"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth:
            - admin:agent
      summary: 获取持久化 Chat 会话
      tags:
        - Copilot
  /comments:
    get:
      operationId: comment-list-by-echo
      parameters:
        - description: Echo ID
          explode: false
          in: query
          name: echo_id
          required: true
          schema:
            description: Echo ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPublicComment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: 按 echo 列出评论
      tags:
        - Comment
    post:
      description: anonymous commenting is an instance policy; the service enforces captcha and moderation
      operationId: comment-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 创建公开评论
      tags:
        - Comment
  /comments/form:
    get:
      description: anonymous readers need captcha and field metadata before commenting
      operationId: comment-form-meta
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormMeta"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 获取评论表单元信息
      tags:
        - Comment
  /comments/integration:
    post:
      operationId: comment-create-integration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntegrationCommentDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth:
            - comment:write
      summary: 经访问令牌创建评论（集成）
      tags:
        - Comment
  /comments/public:
    get:
      operationId: comment-list-public
      parameters:
        - description: 返回数量上限
          explode: false
          in: query
          name: limit
          schema:
            default: 30
            description: 返回数量上限
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPublicComment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
