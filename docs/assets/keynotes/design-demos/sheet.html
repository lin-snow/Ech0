<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>三方向对照</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    padding: 34px;
    background: #ffffff;
    color: #0b0b0b;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  h3 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .col p { margin: 5px 0 14px; font-size: 14px; line-height: 1.55; color: #5b5148; }
  .col img { display: block; width: 100%; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="grid">
  <div class="col">
    <h3>D1 · 白纸巨字</h3>
    <p>白底黑字压满版面，橙球穿出右边缘，产品图从右下角出血 —— 印刷海报的排法。</p>
    <img src="shots/d1-1.png" alt="D1 封面">
    <img src="shots/d1-2.png" alt="D1 产品页">
  </div>
  <div class="col">
    <h3>D2 · 黑场</h3>
    <p>整页压到近黑，巨字发光，橙球像落日；产品页把屏幕放大到出血 —— 发布会的排法。</p>
    <img src="shots/d2-1.png" alt="D2 封面">
    <img src="shots/d2-2.png" alt="D2 产品页">
  </div>
  <div class="col">
    <h3>D3 · 二分</h3>
    <p>版面被一道竖向接缝切成两块实色，字和图各占一边，没有一条线 —— 瑞士海报的排法。</p>
    <img src="shots/d3-1.png" alt="D3 封面">
    <img src="shots/d3-2.png" alt="D3 产品页">
  </div>
</div>
</body>
</html>
