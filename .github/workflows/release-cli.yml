name: Release CLI

# Builds the standalone `ech0` CLI (Bun cross-compiled binaries) and publishes the
# npm packages. Runs after an Ech0 release is published, so the CLI version always
# matches the release tag; re-run manually with workflow_dispatch for a past tag.
#
# Required secret: NPM_TOKEN — an npm automation token allowed to publish the
# `@ech0` scope (`@ech0/cli` + `@ech0/cli-<os>-<arch>`).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build from (e.g. v4.7.0). Must already exist."
        required: true
        type: string
      publish_npm:
        description: "Publish the npm packages"
        required: true
        type: boolean
        default: true

permissions:
  contents: write # upload assets to the GitHub Release
  id-token: write # npm provenance (OIDC)

concurrency:
  group: release-cli-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"
  NODE_VERSION: "26"

jobs:
  build:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve version
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [ -z "${tag}" ]; then
            echo "::error::No release tag: publish a release or pass the workflow_dispatch \`tag\` input."
            exit 1
          fi
          version="${tag#v}"
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag ${tag} is not a semver release tag (expected vX.Y.Z[-prerelease])."
            exit 1
          fi

          # Prerelease versions go to `next` so `npm i -g @ech0/cli` keeps resolving
          # the latest stable release.
          dist_tag="latest"
          case "${version}" in *-*) dist_tag="next" ;; esac
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then dist_tag="next"; fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${dist_tag}" >> "${GITHUB_OUTPUT}"
          echo "Building ech0 CLI ${version} (${tag}), npm dist-tag: ${dist_tag}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: apps/cli
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        working-directory: apps/cli
        run: |
          bun run typecheck
          bun test

      - name: Build binaries, release tarballs and npm packages
        working-directory: apps/cli
        run: bun run scripts/dist.ts --version "${{ steps.meta.outputs.version }}" --out dist/release

      - name: Verify binary reports the release version
        run: |
          set -euo pipefail
          ./apps/cli/dist/release/bin/ech0-linux-x64 --version
          test "$(./apps/cli/dist/release/bin/ech0-linux-x64 --version)" = "${{ steps.meta.outputs.version }}"

      - name: Upload assets to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.meta.outputs.tag }}" \
            apps/cli/dist/release/ech0-cli-*.tar.gz \
            apps/cli/dist/release/SHA256SUMS \
            --clobber

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: apps/cli/dist/release/npm
          retention-days: 7

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'release' || inputs.publish_npm }}
    steps:
      - name: Download npm packages
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-packages

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error title=Missing NPM_TOKEN::Add an npm automation token as the repository secret NPM_TOKEN to publish @ech0/cli."
            exit 1
          fi

          publish() {
            local dir="$1" name published
            name="$(node -p "require('./${dir}/package.json').name")"
            published="$(npm view "${name}@${VERSION}" version 2>/dev/null || true)"
            if [ "${published}" = "${VERSION}" ]; then
              echo "skip ${name}@${VERSION} (already published)"
              return 0
            fi
            echo "publish ${name}@${VERSION} (dist-tag: ${DIST_TAG})"
            (cd "${dir}" && npm publish --provenance --access public --tag "${DIST_TAG}")
          }

          # Platform packages first: the launcher depends on them.
          for dir in npm-packages/cli-*; do
            publish "${dir}"
          done
          publish npm-packages/cli
