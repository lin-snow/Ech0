    <style>
      html.app-loading,
      html.app-loading body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        gap: 14px;
        color: #8a6643;
        background:
          radial-gradient(1200px 680px at 14% 12%, rgba(244, 241, 236, 0.92), transparent 62%),
          radial-gradient(900px 560px at 86% 80%, rgba(241, 236, 228, 0.72), transparent 60%),
          linear-gradient(135deg, var(--color-bg-canvas, #f4f1ec) 0%, #f4f1ec 55%, #f2ede6 100%);
        transition:
          opacity 0.28s ease,
          visibility 0.28s ease;
      }

      #app-loader::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 13px,
            rgba(129, 97, 65, 0.03) 14px
          ),
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 13px,
            rgba(129, 97, 65, 0.025) 14px
          );
        pointer-events: none;
      }

      #app-loader .loader-brand {
        margin: 0;
        display: flex;
        justify-content: center;
        text-align: center;
        font-family: 'Iowan Old Style', 'Palatino Linotype', 'Noto Serif SC', ui-serif, Georgia, serif;
        font-size: 42px;
        line-height: 1;
        letter-spacing: 0.06em;
        color: #7a5436;
        text-shadow: 0 6px 24px rgba(139, 99, 58, 0.2);
        animation: brand-fade-up 0.7s ease-out both;
      }

      #app-loader .loader-brand span {
        display: inline-block;
        transform-origin: 50% 100%;
        animation: letter-hop 2s ease-in-out infinite;
      }

      #app-loader .loader-brand span:nth-child(odd) {
        --tilt: -4deg;
      }

      #app-loader .loader-brand span:nth-child(even) {
        --tilt: 4deg;
      }

      #app-loader .loader-brand span:nth-child(2) {
        animation-delay: 0.09s;
      }

      #app-loader .loader-brand span:nth-child(3) {
        animation-delay: 0.18s;
      }

      #app-loader .loader-brand span:nth-child(4) {
        animation-delay: 0.27s;
      }

      #app-loader p {
        margin: 0;
        text-align: center;
        font-family:
          'Avenir Next', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
          Arial, 'Noto Sans', sans-serif;
        font-size: 12px;
        letter-spacing: 0.16em;
        color: rgba(124, 93, 62, 0.82);
        animation: brand-fade-up 0.7s ease-out 0.2s both;
      }

      #app-loader p::after {
        content: '...';
        display: inline-block;
        width: 1.2em;
        overflow: hidden;
        vertical-align: bottom;
        animation: dots 1.5s steps(4, end) infinite;
      }

      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes letter-hop {
        0%,
        40%,
        100% {
          transform: translateY(0) scale(1) rotate(0deg);
        }
        10% {
          transform: translateY(0.04em) scale(1.08, 0.92) rotate(0deg);
        }
        22% {
          transform: translateY(-0.3em) scale(0.96, 1.05) rotate(var(--tilt, 0deg));
        }
        32% {
          transform: translateY(0) scale(1.06, 0.94) rotate(0deg);
        }
      }

      @keyframes brand-fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes dots {
        from {
          width: 0;
        }
        to {
          width: 1.2em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader .loader-brand,
        #app-loader .loader-brand span,
        #app-loader p,
        #app-loader p::after {
          animation: none;
        }
      }
    </style>
  </head>
